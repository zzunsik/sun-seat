name: Record screenshots

# 의도한 화면 변경 후 기준 이미지를 CI와 같은 환경(ubuntu, Robolectric NATIVE)에서 다시 기록한다.
# 실행: gh workflow run record-screenshots.yml --ref <PR 브랜치>
# 결과: "screenshots" artifact. 내려받아 app/src/test/screenshots/에 덮어쓰고 같은 PR에 커밋한다.
# 절차는 AGENTS.md "화면 작업" 참고.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 빌드 캐시에서 테스트 결과를 가져오면 이미지가 기록되지 않으므로 항상 다시 실행한다.
      - name: Record
        run: ./gradlew recordRoborazziDebug testDebugUnitTest --rerun --console=plain

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: app/src/test/screenshots/
          if-no-files-found: error
          retention-days: 14
