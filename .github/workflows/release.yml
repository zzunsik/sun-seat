name: Release

# 버전 태그(v0.1.0, 시험판 v0.2.0-rc.1)를 push하면 릴리스 키로 서명한 APK를 만들어 빌드 출처 증명을 붙이고
# GitHub Release로 바로 공개한다(초안 단계 없음). 절차·버전 규칙은 AGENTS.md "릴리스"(#118).
# PR·포크 이벤트에서는 돌지 않는다. 서명 시크릿은 GitHub Environment `release`(배포 규칙: 태그 v*)에만 있다.
#
#   verify  (읽기)                         태그 형식·main·버전, 태그 커밋의 ci-passed, 운영 게이트웨이 배포
#   build   (읽기, 환경 release)           서명한 릴리스 APK 빌드·검사. 서명 키와 Gradle이 도는 곳은 여기뿐이다
#   attest  (id-token, attestations)       APK 다이제스트에 빌드 출처 증명
#   publish (contents: write)              GitHub Release 공개(APK + .sha256)
#   cleanup (actions: write)               build → publish 전달용 아티팩트 삭제(성공·실패 모두)
on:
  push:
    tags: ["v*"]

# 기본은 권한 없음. job마다 필요한 것만 준다.
permissions: {}

# 같은 태그의 실행은 하나씩 돈다. 진행 중인 릴리스는 취소하지 않는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # ci-passed(최대 40분)와 게이트웨이 배포(최대 20분)를 기다리는 시간보다 길게 둔다.
    timeout-minutes: 70
    permissions:
      contents: read
      checks: read
      actions: read
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main 이력과 앞 릴리스 태그를 받아 태그가 main에 있는지, 앞 릴리스 뒤 게이트웨이가 바뀌었는지 본다.
          fetch-depth: 0
          persist-credentials: false

      # 태그 형식, 커밋이 main에 있는지, app/build.gradle.kts의 versionName·versionCode가 태그와 같은지,
      # 앞 릴리스 뒤 workers/api가 바뀌었는지 본다(scripts/release-gate.sh, 자체 테스트는 CI release-version job).
      - name: 태그·main·버전 확인
        id: tag
        run: bash scripts/release-gate.sh tag "$TAG" "$GITHUB_SHA" origin/main

      # ci.yml은 main push에서도 돌아 릴리스 머지 커밋에도 ci-passed가 생긴다. 끝날 때까지 기다리고 성공이어야 한다.
      - name: 태그 커밋의 ci-passed 확인
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}
          WAIT_MINUTES: "40"
        run: bash scripts/release-gate.sh ci "$SHA"

      # 앞 릴리스 뒤 게이트웨이(workers/api)가 바뀌었으면, main의 Deploy API gateway 실행이 이 커밋의 게이트웨이 코드를
      # 운영 Worker에 배포해 성공했어야 한다. 배포가 실패한 릴리스는 내보내지 않는다(AGENTS.md "저장소 설정").
      - name: 운영 게이트웨이 배포 확인
        if: steps.tag.outputs.gateway-changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.tag.outputs.sha }}
          WAIT_MINUTES: "20"
        run: bash scripts/release-gate.sh gateway "$SHA"

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # 서명 시크릿과 운영 게이트웨이 주소는 환경 release에만 있다(배포 규칙: 태그 v*).
    environment: release
    env:
      TAG: ${{ github.ref_name }}
      APK_NAME: sun-seat-${{ github.ref_name }}.apk
    outputs:
      sha256: ${{ steps.dist.outputs.sha256 }}
      cert-sha256: ${{ steps.apk.outputs.cert-sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # 시크릿 값은 env로만 넘기고 출력하지 않는다. 있는지만 본다.
      - name: 릴리스 설정 확인
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          SUNSEAT_API_BASE_URL_RELEASE: ${{ vars.SUNSEAT_API_BASE_URL_RELEASE }}
        run: |
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD KAKAO_NATIVE_APP_KEY SUNSEAT_API_BASE_URL_RELEASE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::환경 release에 값이 없습니다:$missing. 저장소 소유자가 Settings > Environments > release에 넣어야 합니다(AGENTS.md \"릴리스\"). 게이트웨이 주소가 비면 검색·경로가 동작하지 않습니다."
            exit 1
          fi
          case "$SUNSEAT_API_BASE_URL_RELEASE" in
            https://*) ;;
            *) echo "::error::SUNSEAT_API_BASE_URL_RELEASE는 https:// 주소여야 합니다."; exit 1 ;;
          esac

      # verify가 확인한 커밋을 받는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # 릴리스 빌드는 Gradle 캐시를 읽거나 쓰지 않는다. 다른 실행이 남긴 캐시가 서명할 APK에 섞이지 않게 한다.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # 키스토어는 작업 폴더 밖(RUNNER_TEMP)에 소유자만 읽을 수 있게 둔다. 마지막 단계에서 지운다.
      - name: 키스토어 풀기
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12" || { echo "::error::RELEASE_KEYSTORE_BASE64를 풀지 못했습니다. base64 한 줄로 넣었는지 확인하세요."; exit 1; }

      # 서명 정보·카카오 네이티브 키·운영 게이트웨이 주소는 환경 변수로만 Gradle에 넘긴다(app/build.gradle.kts buildSetting).
      # local.properties는 만들지 않는다. 설정 캐시에 값이 남지 않게 끄고, 데몬도 남기지 않는다.
      - name: 릴리스 APK 빌드
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          SUNSEAT_API_BASE_URL_RELEASE: ${{ vars.SUNSEAT_API_BASE_URL_RELEASE }}
        run: |
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12"
          ./gradlew assembleRelease --no-configuration-cache --no-daemon --console=plain

      # 만든 APK를 읽어 확인한다. 버전·매니페스트(scripts/check-release-apk.sh), REST 키 경로(scripts/check-apk-secrets.sh),
      # 게이트웨이 주소가 들어갔는지(값은 출력하지 않는다), 서명(apksigner verify)과 서명 인증서 SHA-256 지문.
      - name: APK 확인(버전·매니페스트·키 경로·서명)
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::서명한 릴리스 APK가 없습니다: $apk"; ls -l app/build/outputs/apk/release/ || true; exit 1; }
          bash scripts/check-release-apk.sh "$apk" --tag "$TAG"
          bash scripts/check-apk-secrets.sh release
          build_config=app/build/generated/source/buildConfig/release/com/sunseat/app/BuildConfig.java
          grep -q 'SUNSEAT_API_BASE_URL = "https://' "$build_config" || { echo "::error::릴리스 BuildConfig의 게이트웨이 주소가 비었습니다."; exit 1; }
          grep -q 'KAKAO_NATIVE_APP_KEY = "[^"]' "$build_config" || { echo "::error::릴리스 BuildConfig의 카카오 네이티브 앱 키가 비었습니다."; exit 1; }
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qx 'Number of signers: 1' "$RUNNER_TEMP/certs.txt" || { echo "::error::서명자가 하나가 아닙니다."; exit 1; }
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' "$RUNNER_TEMP/certs.txt")
          [ -n "$cert" ] || { echo "::error::서명 인증서 SHA-256 지문을 읽지 못했습니다."; exit 1; }
          echo "cert-sha256=$cert" >> "$GITHUB_OUTPUT"

      - name: 배포 파일과 체크섬
        id: dist
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/$APK_NAME"
          cd "$RUNNER_TEMP/dist"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          echo "sha256=$(cut -d ' ' -f 1 "$APK_NAME.sha256")" >> "$GITHUB_OUTPUT"

      # 서명 키를 다루고 Gradle이 도는 이 job에는 쓰기 권한을 주지 않으므로, APK는 이 실행 안에서만 쓰는 아티팩트로
      # publish job에 넘긴다(보관 1일, cleanup job이 실행 끝에 지운다). 같은 APK가 곧 Release에 공개된다(AGENTS.md "워크플로").
      - name: publish job에 APK 넘기기
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: ${{ runner.temp }}/dist/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 1

      - name: 키스토어 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  # 빌드 출처 증명(SLSA provenance). 파일 없이 build job이 계산한 다이제스트에 증명을 단다.
  # 확인: gh attestation verify sun-seat-<태그>.apk -R zzunsik/sun-seat
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: sun-seat-${{ github.ref_name }}.apk
          subject-digest: sha256:${{ needs.build.outputs.sha256 }}

  publish:
    needs: [verify, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      APK_NAME: sun-seat-${{ github.ref_name }}.apk
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      CERT_SHA256: ${{ needs.build.outputs.cert-sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: ${{ runner.temp }}/dist

      # 받은 파일이 build가 계산하고 증명한 다이제스트와 같아야 공개한다.
      - name: 다이제스트 확인
        working-directory: ${{ runner.temp }}/dist
        run: |
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build job의 다이제스트가 없습니다."; exit 1; }
          echo "$SHA256  $APK_NAME" > "$APK_NAME.sha256"
          sha256sum --check "$APK_NAME.sha256"

      # 릴리스 노트: 아래 설치·확인 안내 뒤에 GitHub이 앞 릴리스 이후 머지된 PR을 .github/release.yml의 라벨 묶음으로 붙인다.
      # 시험판(vX.Y.Z-rc.N)은 Pre-release로 표시한다. 변경 불가 릴리스라 공개 뒤에는 첨부를 바꿀 수 없다.
      # gh는 첨부가 있으면 초안으로 만들어 올린 뒤 공개하므로, 첨부가 모두 올라간 상태로만 공개된다.
      - name: GitHub Release 공개
        working-directory: ${{ runner.temp }}/dist
        run: |
          cat > notes.md <<EOF
          ## 설치
          아래 \`$APK_NAME\`을 받아 설치합니다. 디버그 빌드나 직접 서명한 APK가 깔린 기기는 서명이 달라 처음 한 번은 기존 앱을 지워야 합니다(저장한 설정·장소도 지워집니다).

          ## 확인
          - APK SHA-256: \`$SHA256\`
          - 서명 인증서 SHA-256: \`$CERT_SHA256\`
          - 빌드 출처: \`gh attestation verify $APK_NAME -R $GITHUB_REPOSITORY\`

          EOF
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${prerelease[@]}"

  # build → publish 전달용 APK 아티팩트를 실행 끝에 지운다(공개에 실패해도). 그래서 실패한 실행은 "Re-run all jobs"로 다시 돌린다.
  cleanup:
    needs: [build, publish]
    if: always() && needs.build.outputs.artifact-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 전달용 아티팩트 지우기
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
