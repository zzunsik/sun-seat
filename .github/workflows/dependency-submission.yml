name: Dependency submission

# Gradle(앱) 의존성을 저장소 의존성 그래프에 올린다(#197). GitHub은 Gradle 빌드 파일을 정적으로 읽지 못하므로
# 이 제출이 없으면 의존성 그래프에 Gradle 패키지가 없어 Dependabot 보안 알림·보안 업데이트 PR이 오지 않는다.
# Dependabot은 기본 브랜치(develop)의 의존성 그래프로 알림을 낸다. main은 릴리스 상태의 그래프를 남기려고 함께 돈다.
# PR·포크 이벤트에서는 돌지 않는다(쓰기 권한이 필요하므로 pull_request·pull_request_target·workflow_run 트리거 없음).
# 시크릿을 쓰지 않고 local.properties 없이(빈 키) 의존성만 해석한다.
# 범위: 모든 구성(앱 런타임, 테스트, 빌드 도구 classpath)을 올린다. 빌드 도구도 CI와 개발 PC에서 돌기 때문이다.
on:
  push:
    branches: [develop, main]

permissions:
  contents: read

# 같은 브랜치에서는 가장 최근 커밋의 그래프만 의미가 있다.
concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 의존성 제출 API(POST /repos/{owner}/{repo}/dependency-graph/snapshots)에 필요한 권한은 이 job에만 준다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # 그래프는 아티팩트로 올리지 않고 바로 제출한다(AGENTS.md "워크플로": 아티팩트는 테스트·스크린샷 결과만).
      # 구성 캐시가 재사용되면 의존성 해석을 건너뛰어 그래프가 비므로 이 실행에서는 끈다.
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-submit
          additional-arguments: --no-configuration-cache
