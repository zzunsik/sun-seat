name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # API 키 없이 빌드한다. local.properties는 만들지 않는다.
      - name: Build
        run: ./gradlew assembleDebug --console=plain

      - name: Lint (compose-lints 포함)
        run: ./gradlew lint --console=plain

      # 단위 테스트(release는 단위 테스트가 꺼져 있어 debug만)를 돌리며 스크린샷을 app/src/test/screenshots/의 기준 이미지와 비교하고,
      # 한 장이라도 다르면 실패한다. 기준 이미지 갱신은 AGENTS.md "화면 작업" 참고.
      - name: Unit tests + screenshot verify
        run: ./gradlew verifyRoborazziDebug --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      # 비교에 실패하면 차이 이미지(*_compare.png)와 실제 렌더링, Roborazzi 리포트를 올린다.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore

  # 머지 판단용 단일 검사. scripts/merge-pr.sh는 이 검사가 PR의 현재 커밋에서 성공일 때만 머지한다.
  # job을 추가하면 needs에 함께 넣는다.
  ci-passed:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 CI job 성공 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job 결과: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || { echo "성공하지 않은 job이 있습니다."; exit 1; }; done
