name: CI

on:
  pull_request:
  push:
    branches: [main]

# 공개 저장소다. 워크플로는 읽기 권한만 쓰고 시크릿을 쓰지 않는다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # API 키 없이 빌드한다. local.properties는 만들지 않는다.
      - name: Build
        run: ./gradlew assembleDebug --console=plain

      - name: Lint (compose-lints 포함)
        run: ./gradlew lint --console=plain

      # 단위 테스트(release는 단위 테스트가 꺼져 있어 debug만)를 돌리며 스크린샷을 app/src/test/screenshots/의 기준 이미지와 비교하고,
      # 한 장이라도 다르면 실패한다. 기준 이미지 갱신은 AGENTS.md "화면 작업" 참고.
      # ci-passed가 auto-merge의 유일한 근거이므로 테스트는 빌드 캐시·최신 판정 결과를 재사용하지 않고
      # 매번 실제로 돈다(--rerun은 바로 앞 작업 testDebugUnitTest에만 적용, #116).
      - name: Unit tests + screenshot verify
        run: ./gradlew verifyRoborazziDebug testDebugUnitTest --rerun --console=plain

      # 실제로 돈 테스트 수를 실행 요약에 남긴다. 결과 파일이 없거나 0건이면 실패한다.
      - name: Test count summary
        if: always()
        run: |
          shopt -s globstar nullglob
          files=(app/build/test-results/testDebugUnitTest/**/*.xml)
          if [ ${#files[@]} -eq 0 ]; then echo "테스트 결과 파일이 없습니다."; exit 1; fi
          read -r tests failures errors skipped < <(cat "${files[@]}" | grep -o '<testsuite [^>]*>' |
            awk '{ for (i = 1; i <= NF; i++) { split($i, kv, "="); gsub(/"/, "", kv[2]);
                     if (kv[1] == "tests") t += kv[2]; else if (kv[1] == "failures") f += kv[2];
                     else if (kv[1] == "errors") e += kv[2]; else if (kv[1] == "skipped") s += kv[2] } }
                   END { print t + 0, f + 0, e + 0, s + 0 }')
          line="단위 테스트 ${tests}건 실행: 실패 ${failures}, 오류 ${errors}, 건너뜀 ${skipped} (결과 파일 ${#files[@]}개)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          [ "$tests" -gt 0 ] || { echo "실행된 테스트가 없습니다."; exit 1; }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # 비교에 실패하면 차이 이미지(*_compare.png)와 실제 렌더링, Roborazzi 리포트를 올린다.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

  # 머지 판단용 단일 검사. main ruleset이 이 검사 하나를 필수로 건다(AGENTS.md "저장소 설정").
  # job을 추가하면 needs에 함께 넣는다.
  ci-passed:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 CI job 성공 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job 결과: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || { echo "성공하지 않은 job이 있습니다."; exit 1; }; done
