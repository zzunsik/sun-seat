name: CI

on:
  pull_request:
    # edited·labeled·unlabeled: PR 본문의 예외 표기나 test-change-approved 라벨이 바뀌면 test-guard를 다시 판정한다(#117).
    # ci-passed 하나가 현재 커밋의 모든 job 결과를 대신하므로 이때도 build를 포함한 전체 CI를 다시 돌린다.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

# 공개 저장소다. 워크플로는 읽기 권한만 쓰고 시크릿을 쓰지 않는다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # API 키 없이 빌드한다. local.properties는 만들지 않는다.
      - name: Build
        run: ./gradlew assembleDebug --console=plain

      - name: Lint (compose-lints 포함)
        run: ./gradlew lint --console=plain

      # 단위 테스트(release는 단위 테스트가 꺼져 있어 debug만)를 돌리며 스크린샷을 app/src/test/screenshots/의 기준 이미지와 비교하고,
      # 한 장이라도 다르면 실패한다. 기준 이미지 갱신은 AGENTS.md "화면 작업" 참고.
      - name: Unit tests + screenshot verify
        run: ./gradlew verifyRoborazziDebug --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # 비교에 실패하면 차이 이미지(*_compare.png)와 실제 렌더링, Roborazzi 리포트를 올린다.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

  # 기존 테스트를 지우거나 약하게 바꾼 PR을 막는다(#117, AGENTS.md "테스트"). 판정은 scripts/test-guard.sh.
  # PR 본문·라벨은 env로만 넘긴다(스크립트 주입 방지). push에서는 자체 테스트만 돌고 판정은 건너뛴다.
  test-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: test-guard 자체 테스트
        run: bash scripts/test-guard-test.sh

      - name: 기존 테스트 삭제·약화 검사
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/test-guard.sh "$BASE_SHA" "$HEAD_SHA"

  # 머지 판단용 단일 검사. main ruleset이 이 검사 하나를 필수로 건다(AGENTS.md "저장소 설정").
  # job을 추가하면 needs에 함께 넣는다.
  ci-passed:
    if: always()
    needs: [build, test-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 CI job 성공 확인
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job 결과: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || { echo "성공하지 않은 job이 있습니다."; exit 1; }; done
