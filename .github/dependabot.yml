version: 2
updates:
  # 의존성 업데이트는 주 1회, 종류별로 PR 하나에 모아 받는다.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      gradle:
        patterns: ["*"]
    # Filament 런타임을 올리면 미리 컴파일한 3D 재료(*.filamat)도 같은 버전의 matc로 다시 컴파일해야 한다.
    # 런타임만 올리면 3D 화면 진입 시 크래시한다(#195). 버전 업데이트는 받지 않고 사람이 함께 올린다
    # (tools/simulation/README.md). versions 없이 이름만 무시하면 보안 업데이트는 계속 온다.
    ignore:
      - dependency-name: "com.google.android.filament*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  # 앱 API 게이트웨이(workers/api, #189). 버전은 package.json에 고정하고 lockfile과 함께 받는다.
  - package-ecosystem: npm
    directory: /workers/api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      api-worker:
        patterns: ["*"]
