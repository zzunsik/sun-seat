version: 2
updates:
  # 의존성 업데이트는 주 1회, 종류별로 PR 하나에 모아 받는다.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  # 앱 API 게이트웨이(workers/api, #189). 버전은 package.json에 고정하고 lockfile과 함께 받는다.
  - package-ecosystem: npm
    directory: /workers/api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      api-worker:
        patterns: ["*"]
